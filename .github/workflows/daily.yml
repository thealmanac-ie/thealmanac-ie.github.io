# Build the site and publish it on GitHub Pages: every morning, on every push to main, and on demand.
# Repository settings: Pages > Build and deployment > Source = "GitHub Actions" (build_type: workflow).
name: Build and deploy

on:
  schedule:
    # 02:17 UTC = 03:17 Irish summer time, 02:17 in winter (GitHub's cron is UTC-only and can run late)
    - cron: '17 2 * * *'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Headless Chromium for prerendering (cached between runs)
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright-core install --with-deps --only-shell chromium
      - name: Last good prerender (fallback if a live API is slow; see lib/fallback.mjs)
        uses: actions/cache@v4
        with:
          path: tmp/prerender-cache
          key: prerender-${{ github.run_id }}
          restore-keys: prerender-
      - id: pages
        uses: actions/configure-pages@v5
      - name: Build
        # The Pages URL (a custom domain once one is set) wins over site.config.mjs
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}/
        run: npm run build
      - name: Build report (fallbacks used, if any)
        if: always()
        run: cat tmp/build-report.json || true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
